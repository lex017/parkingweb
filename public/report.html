<!DOCTYPE html>
<html lang="lo">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ລາຍງານ Firebase</title>
    <link rel="stylesheet" href="css/report.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>

<body>
    <header>ໜ້າລາຍງານ Firebase</header>

    <div class="container">
        <div class="filters">
            <label for="fromDate">ຈາກວັນທີ:</label>
            <input type="date" id="fromDate">

            <label for="toDate">ເຖິງວັນທີ:</label>
            <input type="date" id="toDate">

            <button onclick="filterReport()">ກັ່ນຕອງ</button>
            <button onclick="exportCSV()">ສົ່ງອອກ CSV</button>
            <a href="mainpage.html" class="icon">
                <i class='bx bxs-home'></i>
                <span class="badge"></span>
            </a>

        </div>

    <table id="reportTable">
        <thead>
            <tr>
                <th>ວັນທີ</th>
                <th>ລະຫັດຜູ້ໃຊ້</th>
                <th>ຫົວຂໍ້</th>
                <th>ລາຍລະອຽດ</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    </div>
    <script src="js/report.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

</body>

</html>
